<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Directory</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>

  <style>
    /* ── Base ── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0d0d0d;
      color: #f0ece4;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #f0ece4 30%, #f4a261);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    header p {
      color: #888;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Card ── */
    .user-card {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px 24px;
      height: 100%;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .user-card::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, #f4a26133 0%, transparent 70%);
      pointer-events: none;
    }

    .user-card:hover {
      transform: translateY(-6px);
      border-color: #f4a261;
      box-shadow: 0 12px 40px rgba(244, 162, 97, 0.15);
    }

    /* Avatar */
    .avatar {
      width: 70px; height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f4a261, #e76f51);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .card-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #f0ece4;
    }

    .card-username {
      font-size: 0.82rem;
      color: #f4a261;
      margin-bottom: 14px;
      letter-spacing: 0.04em;
    }

    .card-username::before { content: '@'; }

    .divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 14px 0;
    }

    .card-email {
      font-size: 0.88rem;
      color: #aaa;
      word-break: break-all;
    }

    .card-email a {
      color: #aaa;
      text-decoration: none;
      transition: color 0.2s;
    }

    .card-email a:hover { color: #f4a261; }

    /* ── Loading / Error ── */
    #status {
      text-align: center;
      padding: 80px 20px;
      color: #666;
      font-size: 1rem;
    }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #2a2a2a;
      border-top-color: #f4a261;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Fade-in animation for cards ── */
    .col { opacity: 0; animation: fadeUp 0.4s ease forwards; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>User Information</h1>
    <p>Fetched from JSONPlaceholder API</p>
  </header>

  <main class="container">

    <!-- Loading state -->
    <div id="status">
      <div class="spinner"></div>
      Loading users…
    </div>

    <!-- Card grid (filled by JS) -->
    <div id="card-grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4"></div>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JavaScript code location -->
  <script src="app.js"></script>

</body>
</html>
